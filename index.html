<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F0A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="eChefe — seu chef companheiro com IA. Diga “Ei Chef”.">
<title>eChefe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0F0A00;color:#FFF5E0;font-family:'DM Sans',sans-serif;}
#root{height:100%;}
.root{max-width:420px;width:100%;height:100vh;height:100dvh;margin:0 auto;background:#0F0A00;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.main{position:relative;flex:1;min-height:0;}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px;animation:fs .3s ease;z-index:1;}
@keyframes fs{from{opacity:0}to{opacity:1}}
.bnav{position:relative;flex-shrink:0;width:100%;background:#140E00;border-top:1px solid #3D2800;display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;touch-action:manipulation;}
.nb{flex:1;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:#8A6A40;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;transition:color .2s;padding:4px 2px;-webkit-tap-highlight-color:rgba(255,107,0,.2);touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb svg{width:22px;height:22px;}.nb.on{color:#FF6B00;}
.hdr{padding:24px 20px 16px;}
.logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;font-style:italic;color:#FFF5E0;}
.logo span{color:#FF6B00;}
.sub{font-size:11px;color:#8A6A40;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.card{background:#1E1400;border:1px solid #3D2800;border-radius:16px;padding:16px;margin:0 16px 12px;}
.hero{margin:8px 16px 14px;background:linear-gradient(135deg,#FF6B00,#FF3D00);border-radius:20px;padding:22px 20px;cursor:pointer;border:none;width:calc(100% - 32px);text-align:left;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 32px rgba(255,107,0,.3);}
.hero:hover{transform:translateY(-2px);}
.hero::after{content:'👨‍🍳';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:44px;opacity:.25;}
.hero-t{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;font-style:italic;color:#fff;}
.hero-s{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px;}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px;}
.qb{background:#1E1400;border:1px solid #3D2800;border-radius:14px;padding:16px 14px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;}
.qb:hover{border-color:#FF6B00;background:rgba(255,107,0,.05);}
.qi{font-size:24px;margin-bottom:8px;display:block;}.qt{font-size:13px;font-weight:600;color:#FFF5E0;}.qs{font-size:11px;color:#8A6A40;margin-top:2px;}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;}
.st{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#FFF5E0;}
.sl{font-size:12px;color:#FF6B00;cursor:pointer;}
.rrow{display:flex;gap:12px;padding:0 16px;overflow-x:auto;padding-bottom:8px;}
.rrow::-webkit-scrollbar{display:none;}
.rc{min-width:155px;background:#1E1400;border:1px solid #3D2800;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s;flex-shrink:0;}
.rc:hover{transform:translateY(-3px);}
.ri{width:100%;height:90px;display:flex;align-items:center;justify-content:center;font-size:38px;}
.rb{padding:10px 12px 12px;}.rn{font-size:12px;font-weight:600;color:#FFF5E0;line-height:1.3;}.rm{font-size:10px;color:#8A6A40;margin-top:3px;}
.rtag{display:inline-block;background:rgba(255,107,0,.15);color:#FF6B00;font-size:10px;padding:2px 7px;border-radius:20px;margin-top:5px;font-weight:500;}
.cbbl{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5;}
.cbbl.chef{background:#1E1400;border:1px solid #3D2800;border-radius:16px 16px 16px 4px;color:#FFF5E0;align-self:flex-start;}
.cbbl.user{background:#FF6B00;color:#fff;border-radius:16px 16px 4px 16px;align-self:flex-end;}
.cir{flex-shrink:0;align-items:center;padding:10px 14px;background:rgba(10,6,0,.97);backdrop-filter:blur(16px);border-top:1px solid #3D2800;display:flex;gap:8px;z-index:10;}
.ci{flex:1;background:#1E1400;border:1px solid #3D2800;border-radius:24px;padding:10px 16px;color:#FFF5E0;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.ci:focus{border-color:#FF6B00;}.ci::placeholder{color:#8A6A40;}
.sb{width:42px;height:42px;background:#FF6B00;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;}
.sb:hover{background:#FF8C33;transform:scale(1.05);}.sb:disabled{background:#3D2800;cursor:not-allowed;transform:none;}
.pbtn{width:42px;height:42px;background:#1E1400;border:1px solid #3D2800;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.pbtn:hover{border-color:#FF6B00;}
.bp{background:linear-gradient(135deg,#FF6B00,#FF3D00);color:#fff;border:none;border-radius:14px;padding:14px 24px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;width:calc(100% - 32px);margin:8px 16px;transition:.15s;box-shadow:0 4px 16px rgba(255,107,0,.3);}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,107,0,.4);}
.bs{background:#1E1400;color:#FFF5E0;border:1px solid #3D2800;border-radius:14px;padding:12px 24px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;width:calc(100% - 32px);margin:4px 16px;transition:.2s;}
.bs:hover{border-color:#FF6B00;}
.chip{display:inline-block;background:rgba(255,107,0,.1);border:1px solid rgba(255,107,0,.3);color:#FF6B00;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;margin:4px;transition:.2s;font-family:'DM Sans',sans-serif;}
.chip:hover{background:rgba(255,107,0,.2);}
.typing{display:flex;gap:4px;align-items:center;padding:4px 0;}
.dot{width:7px;height:7px;background:#FF6B00;border-radius:50%;animation:bounce 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
.dc{margin:0 16px 10px;background:#1E1400;border:1px solid #3D2800;border-radius:14px;overflow:hidden;}
.dh{padding:10px 16px;background:rgba(255,107,0,.08);border-bottom:1px solid #3D2800;display:flex;justify-content:space-between;align-items:center;}
.mr{display:flex;padding:10px 16px;gap:10px;border-bottom:1px solid rgba(61,40,0,.5);}
.mr:last-child{border-bottom:none;}
.sli{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(61,40,0,.4);}
.sli:last-child{border-bottom:none;}
.cub{background:#1E1400;border:1px solid #3D2800;border-radius:14px;padding:14px 8px;cursor:pointer;text-align:center;transition:.2s;font-family:'DM Sans',sans-serif;}
.cub.on{border-color:#FF6B00;background:rgba(255,107,0,.08);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#3D2800;border-radius:3px;}
@keyframes vb0{from{height:4px}to{height:18px}}@keyframes vb1{from{height:6px}to{height:14px}}
@keyframes vb2{from{height:4px}to{height:20px}}@keyframes vb3{from{height:8px}to{height:12px}}
@keyframes vb4{from{height:4px}to{height:16px}}
@keyframes cookPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,0,.5)}50%{box-shadow:0 0 0 12px rgba(255,107,0,0)}}
@keyframes snapFlash{0%{opacity:0}20%{opacity:.8}100%{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js?v=4"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
